name: Build JARVIS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Scaffold a fresh Flutter Android project
        run: flutter create --org com.jarvis --project-name jarvis_app --platforms android scaffold

      - name: Inject app code into the scaffold
        run: |
          cp pubspec.yaml scaffold/pubspec.yaml
          rm -rf scaffold/lib
          cp -r lib scaffold/lib

      - name: Add required Android permissions
        run: |
          python3 - <<'EOF'
          import re
          path = "scaffold/android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perms = (
              '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              '\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
          )
          content = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, content, count=1)
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Get packages
        working-directory: scaffold
        run: flutter pub get

      - name: Build release APK
        working-directory: scaffold
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: scaffold/build/app/outputs/flutter-apk/app-release.apk
